# ============================================================
# agent.yaml — BTP Publisher Agent Configuration
# ============================================================
# Part of: 3pl-automation BTP-publisher feature (sibling of the Solace and MuleSoft
#          publisher agents — see agent/solace/agent.yaml, agent/mulesoft/agent.yaml)
#
# Purpose:    Two-phase agent. Phase 1 handles ANY BTP config change for a partner
#             subaccount — a brand-new onboarding (btp_config.yaml + optional
#             manifest.yml), or an update to one that already exists (entitlements,
#             subaccount/CF settings, the app manifest, etc.) — from a free-text email
#             request, following fixed templates, masking any credential field. It tells
#             new apart from update by reading each candidate file's current content off
#             btp/onboarding first, and for an update, merges the requested change into
#             that real content instead of guessing at it or dropping unrelated existing
#             structure. Phase 2 (only after human approval) commits the exact approved
#             file(s) to the persistent btp/onboarding branch in soubhik7/3pl-automation
#             and ensures a PR is open from it — no config of any kind reaches GitHub
#             without that approval.
#             NOTE: this is a narrow generate+publish-to-GitHub agent, distinct from
#             btp-automation/btp_mcp_server.py's separate 46-tool BTP cockpit MCP server —
#             this agent never calls BTP/CF APIs directly.
# Invoked by: btp-generate-workflow / btp-publish-workflow (this feature's own two
#             single-step Foundry Workflows) — never invoked directly by name.
# Tools:      github_get_file (Phase 1, read-only — checks for existing files to update),
#             github_commit_file, github_open_pull_request (Phase 2 only) — served by this
#             feature's own dedicated MCP server (btp-mcp). No branch-creation tool exists
#             — btp/onboarding is created once as a manual setup step (see
#             ../../README.md "One-time setup"), never by the agent. Same tool
#             implementations as the Solace/MuleSoft agents, exposed on a separate MCP
#             route.
# Auth:       github_get_file/github_commit_file/github_open_pull_request authenticate to
#             GitHub. Live today: a classic PAT in the GITHUB_TOKEN App Setting on the
#             Function App. Coded but not yet active: a GitHub App whose private key
#             would live in Key Vault, fetched via this Function App's managed identity —
#             blocked for now because Key Vault denies secret access to every identity in
#             this subscription (see ../../deployment/README.md). No code change needed
#             to switch once Key Vault access is granted — see mcp-server/lib/github_client.py.
# Importance: The only BTP agent authorised to push to soubhik7/3pl-automation.
# ============================================================
name: integration-pulse-btp-publisher
model: ${BTP_PUBLISHER_MODEL:-gpt-4.1}
description: "Two-phase BTP onboarding config generator + publisher — handles new onboardings and updates to existing ones. Phase 1 generates a masked-credential btp_config.yaml (and optional manifest.yml) from an email request, reading current files first if updating them. Phase 2, only after human approval, commits them to the persistent btp/onboarding branch and ensures a PR is open."
instructions: "@system-prompt.md"

tools:
  - type: mcp
    server_label: btp-mcp
    server_url: ${BTP_MCP_ENDPOINT}
    allowed_tools:
      - github_get_file          # Phase 1: check whether this slug's files already exist (update) or not (new)
      - github_commit_file       # Phase 2: commit each approved YAML file to btp/onboarding
      - github_open_pull_request # Phase 2: ensure a PR is open from btp/onboarding to main (idempotent)
