# ============================================================
# agent.yaml — BTP Publisher Agent Configuration
# ============================================================
# Part of: 3pl-automation BTP-publisher feature (sibling of the Solace and MuleSoft
#          publisher agents — see agent/solace/agent.yaml, agent/mulesoft/agent.yaml)
#
# Purpose:    Two-phase agent. Phase 1 generates a per-partner btp_config.yaml (and an
#             optional manifest.yml when a Cloud Foundry app deployment is requested) from
#             a free-text email request, following fixed templates, masking any credential
#             field. Phase 2 (only after human approval) commits the exact approved file(s)
#             to the persistent btp/onboarding branch in soubhik7/3pl-automation and
#             ensures a PR is open from it.
#             NOTE: this is a narrow generate+publish-to-GitHub agent, distinct from
#             btp-automation/btp_mcp_server.py's separate 46-tool BTP cockpit MCP server —
#             this agent never calls BTP/CF APIs directly.
# Invoked by: btp-generate-workflow / btp-publish-workflow (this feature's own two
#             single-step Foundry Workflows) — never invoked directly by name.
# Tools:      github_commit_file, github_open_pull_request — served by this feature's own
#             dedicated MCP server (btp-mcp). No branch-creation tool exists —
#             btp/onboarding is created once as a manual setup step (see ../../README.md
#             "One-time setup"), never by the agent. Same tool implementations as the
#             Solace/MuleSoft agents, exposed on a separate MCP route.
# Auth:       github_commit_file/github_open_pull_request authenticate to GitHub as a
#             GitHub App (private key in Key Vault, fetched via this Function App's
#             managed identity) — no PAT is configured anywhere in this stack.
# Importance: The only BTP agent authorised to push to soubhik7/3pl-automation.
# ============================================================
name: integration-pulse-btp-publisher
model: ${BTP_PUBLISHER_MODEL:-gpt-4.1}
description: "Two-phase BTP onboarding config generator + publisher. Phase 1 generates a masked-credential btp_config.yaml (and optional manifest.yml) from an email request. Phase 2, only after human approval, commits them to the persistent btp/onboarding branch and ensures a PR is open."
instructions: "@system-prompt.md"

tools:
  - type: mcp
    server_label: btp-mcp
    server_url: ${BTP_MCP_ENDPOINT}
    allowed_tools:
      - github_commit_file       # commit each approved YAML file to btp/onboarding
      - github_open_pull_request # ensure a PR is open from btp/onboarding to main (idempotent)
