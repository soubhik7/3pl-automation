# ============================================================
# agent.yaml — MuleSoft Publisher Agent Configuration
# ============================================================
# Part of: 3pl-automation MuleSoft-publisher feature (sibling of the Solace and BTP
#          publisher agents — see agent/solace/agent.yaml, agent/btp/agent.yaml)
#
# Purpose:    Two-phase agent. Phase 1 generates 4 MuleSoft NAV-connector onboarding YAML
#             files (app/dev/tst/prod) from a free-text email request, following a fixed
#             template, masking any credential field. Phase 2 (only after human approval)
#             commits the exact approved YAML files to the persistent mulesoft/onboarding
#             branch in soubhik7/3pl-automation and ensures a PR is open from it.
# Invoked by: mulesoft-generate-workflow / mulesoft-publish-workflow (this feature's own
#             two single-step Foundry Workflows) — never invoked directly by name.
# Tools:      github_commit_file, github_open_pull_request — served by this feature's own
#             dedicated MCP server (mulesoft-mcp). No branch-creation tool exists —
#             mulesoft/onboarding is created once as a manual setup step (see
#             ../../README.md "One-time setup"), never by the agent. Same tool
#             implementations as the Solace/BTP agents, exposed on a separate MCP route.
# Auth:       github_commit_file/github_open_pull_request authenticate to GitHub as a
#             GitHub App (private key in Key Vault, fetched via this Function App's
#             managed identity) — no PAT is configured anywhere in this stack.
# Importance: The only MuleSoft agent authorised to push to soubhik7/3pl-automation.
# ============================================================
name: integration-pulse-mulesoft-publisher
model: ${MULESOFT_PUBLISHER_MODEL:-gpt-4.1}
description: "Two-phase MuleSoft onboarding YAML generator + publisher. Phase 1 generates masked-credential app/dev/tst/prod YAML from an email request. Phase 2, only after human approval, commits them to the persistent mulesoft/onboarding branch and ensures a PR is open."
instructions: "@system-prompt.md"

tools:
  - type: mcp
    server_label: mulesoft-mcp
    server_url: ${MULESOFT_MCP_ENDPOINT}
    allowed_tools:
      - github_commit_file       # commit each approved YAML file to mulesoft/onboarding
      - github_open_pull_request # ensure a PR is open from mulesoft/onboarding to main (idempotent)
