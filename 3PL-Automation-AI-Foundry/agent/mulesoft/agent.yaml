# ============================================================
# agent.yaml — MuleSoft Publisher Agent Configuration
# ============================================================
# Part of: 3pl-automation MuleSoft-publisher feature (sibling of the Solace and BTP
#          publisher agents — see agent/solace/agent.yaml, agent/btp/agent.yaml)
#
# Purpose:    Two-phase agent. Phase 1 handles ANY MuleSoft NAV-connector config change
#             for a country/partner — a brand-new onboarding (up to 4 YAML files:
#             app/dev/tst/prod), or an update to one that already exists (change a host,
#             routing code, transaction type, translation mapping, etc., in just the
#             file(s) actually affected) — from a free-text email request, following a
#             fixed template, masking any credential field. It tells new apart from update
#             by reading each candidate file's current content off mulesoft/onboarding
#             first, and for an update, merges the requested change into that real
#             content instead of guessing at it or dropping unrelated existing structure.
#             Phase 2 (only after human approval) commits the exact approved YAML files to
#             the persistent mulesoft/onboarding branch in soubhik7/3pl-automation and
#             ensures a PR is open from it — no config of any kind reaches GitHub without
#             that approval.
# Invoked by: mulesoft-generate-workflow / mulesoft-publish-workflow (this feature's own
#             two single-step Foundry Workflows) — never invoked directly by name.
# Tools:      github_get_file (Phase 1, read-only — checks for existing files to update),
#             github_commit_file, github_open_pull_request (Phase 2 only) — served by this
#             feature's own dedicated MCP server (mulesoft-mcp). No branch-creation tool
#             exists — mulesoft/onboarding is created once as a manual setup step (see
#             ../../README.md "One-time setup"), never by the agent. Same tool
#             implementations as the Solace/BTP agents, exposed on a separate MCP route.
# Auth:       github_get_file/github_commit_file/github_open_pull_request authenticate to
#             GitHub. Live today: a classic PAT in the GITHUB_TOKEN App Setting on the
#             Function App. Coded but not yet active: a GitHub App whose private key
#             would live in Key Vault, fetched via this Function App's managed identity —
#             blocked for now because Key Vault denies secret access to every identity in
#             this subscription (see ../../deployment/README.md). No code change needed
#             to switch once Key Vault access is granted — see mcp-server/lib/github_client.py.
# Importance: The only MuleSoft agent authorised to push to soubhik7/3pl-automation.
# ============================================================
name: integration-pulse-mulesoft-publisher
model: ${MULESOFT_PUBLISHER_MODEL:-gpt-4.1}
description: "Two-phase MuleSoft onboarding YAML generator + publisher — handles new onboardings and updates to existing ones. Phase 1 generates masked-credential app/dev/tst/prod YAML from an email request, reading current files first if updating them. Phase 2, only after human approval, commits them to the persistent mulesoft/onboarding branch and ensures a PR is open."
instructions: "@system-prompt.md"

tools:
  - type: mcp
    server_label: mulesoft-mcp
    server_url: ${MULESOFT_MCP_ENDPOINT}
    allowed_tools:
      - github_get_file          # Phase 1: check whether this slug's files already exist (update) or not (new)
      - github_commit_file       # Phase 2: commit each approved YAML file to mulesoft/onboarding
      - github_open_pull_request # Phase 2: ensure a PR is open from mulesoft/onboarding to main (idempotent)
