# ============================================================
# agent.yaml — Solace Publisher Agent Configuration
# ============================================================
# Part of: 3pl-automation Solace-publisher feature (fully isolated from the main
#          Integration Pulse agents/MCP servers/Toolbox)
#
# Purpose:    Two-phase agent. Phase 1 handles ANY Solace config change for a
#             customer/domain — a brand-new integration domain, or an update to one that
#             already exists (add/remove a queue, schema, event, ACL exception, REST
#             delivery point, etc.) — from a free-text email request, following a fixed
#             template, masking any credential field. It tells new apart from update by
#             reading the current file (if any) off solace/onboarding first, and for an
#             update, merges the requested change into that real content instead of
#             guessing at it or dropping unrelated existing structure. Phase 2 (only after
#             human approval) commits the exact approved JSON to the persistent
#             solace/onboarding branch in soubhik7/3pl-automation and ensures a PR is open
#             from it — no config of any kind reaches GitHub without that approval.
# Invoked by: solace-generate-workflow / solace-publish-workflow (this feature's own
#             two single-step Foundry Workflows) — never invoked directly by name.
# Tools:      github_get_file (Phase 1, read-only — checks for an existing config to
#             update), github_commit_file, github_open_pull_request (Phase 2 only) —
#             served by this feature's own dedicated MCP server (solace-mcp), not the main
#             Toolbox. No branch-creation tool exists — solace/onboarding is created once
#             as a manual setup step (see ../../README.md "One-time setup"), never by the
#             agent. Shared tool implementations also back the mulesoft-mcp/btp-mcp
#             sibling agents.
# Auth:       github_get_file/github_commit_file/github_open_pull_request authenticate to
#             GitHub. Live today: a classic PAT in the GITHUB_TOKEN App Setting on the
#             Function App. Coded but not yet active: a GitHub App whose private key
#             would live in Key Vault, fetched via this Function App's managed identity —
#             blocked for now because Key Vault denies secret access to every identity in
#             this subscription (see ../../deployment/README.md). No code change needed
#             to switch once Key Vault access is granted — see mcp-server/lib/github_client.py.
# Importance: The only Solace agent authorised to push to soubhik7/3pl-automation.
# ============================================================
name: integration-pulse-solace-publisher
model: ${SOLACE_PUBLISHER_MODEL:-gpt-4.1}
description: "Two-phase Solace config generator + publisher — handles new domains and updates to existing ones. Phase 1 generates a masked-credential Solace JSON from an email request, reading the current file first if updating one. Phase 2, only after human approval, commits it to the persistent solace/onboarding branch and ensures a PR is open."
instructions: "@system-prompt.md"

tools:
  - type: mcp
    server_label: solace-mcp
    server_url: ${SOLACE_MCP_ENDPOINT}
    allowed_tools:
      - github_get_file          # Phase 1: check whether this slug's config already exists (update) or not (new)
      - github_commit_file       # Phase 2: commit the approved Solace JSON to solace/onboarding
      - github_open_pull_request # Phase 2: ensure a PR is open from solace/onboarding to main (idempotent)
