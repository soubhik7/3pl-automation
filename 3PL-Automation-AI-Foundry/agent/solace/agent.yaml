# ============================================================
# agent.yaml — Solace Publisher Agent Configuration
# ============================================================
# Part of: 3pl-automation Solace-publisher feature (fully isolated from the main
#          Integration Pulse agents/MCP servers/Toolbox)
#
# Purpose:    Two-phase agent. Phase 1 generates a Solace integration-domain JSON from
#             a free-text email request, following a fixed template, masking any
#             credential field. Phase 2 (only after human approval) commits the exact
#             approved JSON to the persistent solace/onboarding branch in
#             soubhik7/3pl-automation and ensures a PR is open from it.
# Invoked by: solace-generate-workflow / solace-publish-workflow (this feature's own
#             two single-step Foundry Workflows) — never invoked directly by name.
# Tools:      github_commit_file, github_open_pull_request — served by this feature's own
#             dedicated MCP server (solace-mcp), not the main Toolbox. No branch-creation
#             tool exists — solace/onboarding is created once as a manual setup step (see
#             ../../README.md "One-time setup"), never by the agent. Shared tool
#             implementations also back the mulesoft-mcp/btp-mcp sibling agents.
# Auth:       github_commit_file/github_open_pull_request authenticate to GitHub as a
#             GitHub App (private key in Key Vault, fetched via this Function App's
#             managed identity) — no PAT is configured anywhere in this stack.
# Importance: The only Solace agent authorised to push to soubhik7/3pl-automation.
# ============================================================
name: integration-pulse-solace-publisher
model: ${SOLACE_PUBLISHER_MODEL:-gpt-4.1}
description: "Two-phase Solace config generator + publisher. Phase 1 generates a masked-credential Solace JSON from an email request. Phase 2, only after human approval, commits it to the persistent solace/onboarding branch and ensures a PR is open."
instructions: "@system-prompt.md"

tools:
  - type: mcp
    server_label: solace-mcp
    server_url: ${SOLACE_MCP_ENDPOINT}
    allowed_tools:
      - github_commit_file       # commit the approved Solace JSON to solace/onboarding
      - github_open_pull_request # ensure a PR is open from solace/onboarding to main (idempotent)
