[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btp-automation"
version = "1.0.0"
description = "SAP BTP Automation CLI – Accounts, Entitlements, Security, Services"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    # Web API + MCP server
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4.0",
    "black>=24.0",
    "mypy>=1.8",
    "types-requests>=2.31",
    "types-pyyaml>=6.0",
]

[project.scripts]
btp-auto     = "btp_cli:cli"
btp-api      = "btp_api:app"
btp-mcp      = "btp_mcp_server:mcp"

[tool.setuptools.packages.find]
where = ["."]
include = ["btp*", "btp_web*"]

[tool.setuptools]
py-modules = ["btp_cli", "btp_api", "btp_mcp_server"]

[tool.setuptools.package-data]
"btp" = ["py.typed"]

# ── Ruff (linter) ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

# ── Black (formatter) ────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
